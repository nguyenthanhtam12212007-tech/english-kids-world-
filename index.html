    const getEmbedUrl = (url) => {
      if (!url) return '';
      if (url.includes('embed/')) return url;
      let videoId = '';
      if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1]?.split('?')[0];
      } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1]?.split('&')[0];
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
    };

    const getWatchUrl = (url) => {
      if (!url) return 'https://www.youtube.com';

        const id = url.split('embed/')[1]?.split('?')[0];
        return `https://www.youtube.com/watch?v=${id}`;

        const saved = localStorage.getItem('ekw_parent_account');
        return saved ? JSON.parse(saved) : null;
      });
      const [parentPin, setParentPin] = useState(() => localStorage.getItem('ekw_parent_pin') || '1234');

      const [userProfile, setUserProfile] = useState(() => {
        const saved = localStorage.getItem('ekw_user_profile');
        return saved ? JSON.parse(saved) : {
          nickname: 'Bé Yêu',
          avatar: '🦁',
          ageGroup: 'u3',
          completedLessonIds: [],
          badges: [],
          scores: {},
          timeSpentMinutes: 15,
          dailyLimitMinutes: 30,
          lastActiveLessonId: 'u3-animals'
        };
      });

      useEffect(() => { localStorage.setItem('ekw_lang', lang); }, [lang]);
      useEffect(() => { localStorage.setItem('ekw_user_profile', JSON.stringify(userProfile)); }, [userProfile]);
      useEffect(() => {
        if (parentAccount) localStorage.setItem('ekw_parent_account', JSON.stringify(parentAccount));
        else localStorage.removeItem('ekw_parent_account');
      }, [parentAccount]);

      const setLang = (l) => setLangState(l);
      const setAgeGroup = (ageGroup) => setUserProfile(prev => ({ ...prev, ageGroup }));

      const updateKidProfile = (nickname, avatar, ageGroup) => {
        setUserProfile(prev => ({ ...prev, nickname, avatar, ageGroup }));
      };

      const completeLesson = (lessonId, badgeIcon, score) => {
        setUserProfile(prev => {
          const completed = new Set(prev.completedLessonIds);
          completed.add(lessonId);
          const badges = new Set(prev.badges);
          if (badgeIcon) badges.add(badgeIcon);
          return {
            ...prev,
            completedLessonIds: Array.from(completed),
            badges: Array.from(badges),
            scores: { ...prev.scores, [lessonId]: Math.max(prev.scores[lessonId] || 0, score) },
            lastActiveLessonId: lessonId
          };
        });
      };

      const loginParent = (email, name) => setParentAccount({ email, name, loggedInAt: new Date().toISOString() });
      const logoutParent = () => setParentAccount(null);
      const resetProgress = () => {
        setUserProfile({
          nickname: 'Bé Yêu', avatar: '🦁', ageGroup: 'u3', completedLessonIds: [], badges: [], scores: {}, timeSpentMinutes: 0, dailyLimitMinutes: 30, lastActiveLessonId: 'u3-animals'
        });
        localStorage.removeItem('ekw_user_profile');
      };

      return (
        <AppContext.Provider value={{
          lang, setLang, userProfile, setAgeGroup, completeLesson, resetProgress,
          parentAccount, loginParent, logoutParent, parentPin, setParentPin, updateKidProfile
        }}>
          {children}
        </AppContext.Provider>
      );

    const speakText = (text, lang = 'en-US') => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.82;
        utterance.pitch = 1.2;

        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => 
          (v.lang.includes('en') || v.lang.includes('US') || v.lang.includes('GB')) &&
          (v.name.toLowerCase().includes('female') || 
           v.name.toLowerCase().includes('zira') || 
           v.name.toLowerCase().includes('samantha') || 
           v.name.toLowerCase().includes('google us english') ||
           v.name.toLowerCase().includes('victoria') ||
           v.name.toLowerCase().includes('karen'))
        ) || voices.find(v => v.lang.includes('en'));

        if (femaleVoice) utterance.voice = femaleVoice;
        window.speechSynthesis.speak(utterance);
      }
    };

      const handleStartListen = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Trình duyệt không hỗ trợ Web Speech API.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.onstart = () => setListening(true);
        recognition.onend = () => setListening(false);
        recognition.onresult = (e) => setRecognizedText(e.results[0][0].transcript);
        recognition.start();
      };

      return (
        <div className="bg-white p-5 sm:p-7 rounded-3xl border-4 border-pink-100 shadow-md">
          <h3 className="text-xl font-black text-pink-600 mb-4">🗣️ Bước 2: Luyện Nói Cùng AI Giọng Nữ (Mở Rộng)</h3>
          
          <div className="flex gap-2 overflow-x-auto pb-3 mb-4 custom-scrollbar">
            {lesson.speakingPhrases.map((p, idx) => (
              <button
                key={idx}
                onClick={() => { setActiveIdx(idx); setRecognizedText(''); }}
                className={`px-4 py-2 rounded-2xl font-black whitespace-nowrap transition ${activeIdx === idx ? 'bg-pink-500 text-white shadow-md' : 'bg-slate-100 text-slate-600'}`}
              >
                Mẫu câu {idx + 1}
              </button>
            ))}
          </div>

          <div className="bg-pink-50 border-2 border-pink-200 rounded-3xl p-6 text-center max-w-xl mx-auto mb-6">
            <p className="text-3xl font-black text-slate-800 mb-2">{phrase.textEn}</p>
            <p className="text-slate-600 font-bold mb-6">{phrase.textVi}</p>
            <div className="flex flex-wrap justify-center gap-3">
              <button onClick={() => speakText(phrase.textEn)} className="bg-amber-400 hover:bg-amber-500 text-amber-950 font-black px-6 py-3 rounded-2xl shadow-md transition active:scale-95">
                🔊 Nghe giọng AI nữ
              </button>
              <button onClick={handleStartListen} className={`${listening ? 'bg-red-500 animate-pulse' : 'bg-emerald-500 hover:bg-emerald-600'} text-white font-black px-6 py-3 rounded-2xl shadow-md transition active:scale-95`}>
                🎤 {listening ? 'Đang nghe bé nói...' : 'Bấm mic để nói'}
              </button>
            </div>
          </div>
          {recognizedText && <div className="text-center bg-emerald-50 border border-emerald-200 p-4 rounded-2xl font-black text-emerald-900 max-w-xl mx-auto">Nhận diện được: "{recognizedText}" 🎉</div>}
        </div>
      );
    };

    const Step3Vocabulary = ({ lesson }) => (
      <div className="bg-white p-5 sm:p-7 rounded-3xl border-4 border-emerald-100 shadow-md">
        <h3 className="text-xl font-black text-emerald-600 mb-4">📚 Bước 3: Học Từ Vựng Chi Tiết qua Hình Ảnh</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          {lesson.vocabulary.map((vocab) => (
            <div key={vocab.id} className="bg-emerald-50/60 border-2 border-emerald-200 rounded-3xl overflow-hidden shadow-sm p-4 text-center">
              <SafeImage
                src={vocab.imageUrl}
                alt={vocab.word}
                icon={vocab.icon}
                className="w-full h-40 object-cover rounded-2xl mb-3 shadow-inner"
              />
              <div className="flex justify-center items-center gap-2 mb-1">
                <h4 className="text-2xl font-black text-slate-800">{vocab.word}</h4>
                <button onClick={() => speakText(vocab.word)} className="p-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full transition shadow-sm">🔊</button>
              </div>
              {vocab.ipa && <p className="text-xs font-mono text-emerald-700 mb-1">{vocab.ipa}</p>}
              <p className="text-base font-extrabold text-emerald-900 mb-2">{vocab.translation}</p>
              <div className="bg-white p-2.5 rounded-2xl border border-emerald-100 text-xs text-left">
                <p className="font-bold text-slate-700">"{vocab.exampleEn}"</p>
                <p className="text-slate-500">{vocab.exampleVi}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    );

    const Step4Games = ({ lesson }) => {
      const [gameIdx, setGameIdx] = useState(0);
      const [selectedOptId, setSelectedOptId] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);

      const currentGame = lesson.games[gameIdx] || lesson.games[0];

      const handleSelect = (optId) => {
        if (isSubmitted) return;
        setSelectedOptId(optId);
        setIsSubmitted(true);
      };

      const selectedOpt = currentGame.options.find(o => o.id === selectedOptId);

      return (
        <div className="bg-white p-5 sm:p-7 rounded-3xl border-4 border-amber-100 shadow-md">
          <h3 className="text-xl font-black text-amber-600 mb-4 flex justify-between items-center">
            <span>🎮 Bước 4: Trò Chơi Tương Tác Vui Nhộn</span>
            <span className="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full">Câu {gameIdx + 1}/{lesson.games.length}</span>
          </h3>

          <div className="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 text-center mb-6">
            <h4 className="text-2xl font-black text-slate-800 mb-1">{currentGame.promptEn}</h4>
            <p className="text-slate-600 font-bold">{currentGame.promptVi}</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            {currentGame.options.map((opt) => {
              let btnStyle = 'bg-slate-50 border-2 border-slate-200 hover:border-amber-400';
              if (isSubmitted) {
                if (opt.isCorrect) btnStyle = 'bg-emerald-100 border-2 border-emerald-500 text-emerald-900';
                else if (opt.id === selectedOptId) btnStyle = 'bg-red-100 border-2 border-red-500 text-red-900';
              }

              return (
                <button
                  key={opt.id}
                  onClick={() => handleSelect(opt.id)}
                  className={`p-5 rounded-3xl font-black text-lg transition shadow-sm flex items-center justify-center gap-3 ${btnStyle}`}
                >
                  <span className="text-3xl">{opt.icon || '⭐'}</span>
                  <span>{opt.label}</span>
                </button>
              );
            })}
          </div>

          {isSubmitted && (
            <div className={`p-4 rounded-2xl mb-4 border-2 ${selectedOpt?.isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-900'}`}>
              <p className="font-black text-lg">{selectedOpt?.isCorrect ? 'Chính xác! Bé quá giỏi! 🎉' : 'Chưa đúng rồi! 💪'}</p>
              <p className="text-sm font-bold mt-1">{currentGame.explanationVi}</p>
            </div>
          )}

          {isSubmitted && gameIdx + 1 < lesson.games.length && (
            <div className="text-right">
              <button
                onClick={() => {
                  setIsSubmitted(false);
                  setSelectedOptId(null);
                  setGameIdx(prev => prev + 1);
                }}
                className="bg-amber-500 hover:bg-amber-600 text-white font-black px-6 py-2.5 rounded-2xl shadow-md transition"
              >
                Câu tiếp theo ➔
              </button>
            </div>
          )}
        </div>
      );
    };

    const Step5Review = ({ lesson, onFinish }) => {
      const { completeLesson } = useApp();
      const [submitted, setSubmitted] = useState(false);
      const category = categoriesData.find(c => c.id === lesson.categoryId);

      const handleFinish = () => {
        setSubmitted(true);
        completeLesson(lesson.id, category?.badgeIcon || '⭐', 100);
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
      };

      return (
        <div className="bg-white p-5 sm:p-7 rounded-3xl border-4 border-purple-100 shadow-md text-center">
          <h3 className="text-xl font-black text-purple-600 mb-4">📝 Bước 5: Ôn Tập & Nhận Huy Hiệu</h3>
          {!submitted ? (
            <button onClick={handleFinish} className="bg-purple-600 hover:bg-purple-700 text-white font-black px-8 py-3.5 rounded-2xl shadow-md text-lg transition">Nộp Bài & Nhận Huy Hiệu 🏆</button>
          ) : (
            <div>
              <div className="text-6xl mb-3 animate-bounce">🏆</div>
              <h4 className="text-3xl font-black text-slate-800 mb-2">Chúc Mừng Bé Xuất Sắc!</h4>
              <p className="text-slate-600 font-bold mb-4">Bé đã hoàn thành trọn vẹn bài học này!</p>
              <button onClick={onFinish} className="bg-emerald-500 hover:bg-emerald-600 text-white font-black px-6 py-2.5 rounded-2xl shadow-md transition">Về Trang Chủ</button>
            </div>
          )}
        </div>
      );
    };

    const LessonPage = ({ lesson, onBack }) => {
      const [currentStep, setCurrentStep] = useState(1);
      return (
        <div className="max-w-5xl mx-auto px-4 py-6">
          <button onClick={onBack} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-black px-4 py-2 rounded-2xl transition mb-6">⬅ Trang Chủ</button>
          <div className="flex justify-between bg-white p-2.5 rounded-2xl border-2 border-slate-100 mb-6 overflow-x-auto custom-scrollbar">
            {[1,2,3,4,5].map(s => (
              <button key={s} onClick={() => setCurrentStep(s)} className={`px-4 py-2 rounded-xl font-black transition ${currentStep === s ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>Bước {s}</button>
            ))}
          </div>
          {currentStep === 1 && <Step1Video lesson={lesson} />}
          {currentStep === 2 && <Step2Speaking lesson={lesson} />}
          {currentStep === 3 && <Step3Vocabulary lesson={lesson} />}
          {currentStep === 4 && <Step4Games lesson={lesson} />}
          {currentStep === 5 && <Step5Review lesson={lesson} onFinish={onBack} />}
        </div>
      );
    };

    // ==========================================
    // 6. TRANG CHỦ & PHỤ HUYNH
    // ==========================================
    const HomePage = ({ onSelectLesson }) => {
      const { lang, userProfile, setAgeGroup } = useApp();
      const t = translations[lang];

      const activeAgeLessons = lessonsData.filter(l => l.targetAge === userProfile.ageGroup);
      const featured = activeAgeLessons[0] || lessonsData[0];

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          <Mascot message="Chào mừng bé đến với English Kids World! Chọn nhóm tuổi hoặc các chủ đề sinh động để bắt đầu học nhé!" />

          <div className="bg-white p-4 sm:p-6 rounded-3xl border-2 border-slate-100 shadow-sm mb-8">
            <p className="text-center font-black text-slate-700 mb-4 text-sm sm:text-base">{t.selectAgeGroup}</p>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <button onClick={() => setAgeGroup('u3')} className={`p-4 rounded-2xl border-4 text-left font-black transition ${userProfile.ageGroup === 'u3' ? 'border-pink-400 bg-pink-50 text-pink-900 shadow-sm' : 'border-slate-100 bg-slate-50 text-slate-600'}`}>
                <div className="text-lg">👶 {t.ageU3}</div>
                <div className="text-xs font-bold text-slate-500 mt-1">{t.descU3}</div>
              </button>
              <button onClick={() => setAgeGroup('34')} className={`p-4 rounded-2xl border-4 text-left font-black transition ${userProfile.ageGroup === '34' ? 'border-amber-400 bg-amber-50 text-amber-900 shadow-sm' : 'border-slate-100 bg-slate-50 text-slate-600'}`}>
                <div className="text-lg">🧸 {t.age34}</div>
                <div className="text-xs font-bold text-slate-500 mt-1">{t.desc34}</div>
              </button>
              <button onClick={() => setAgeGroup('56')} className={`p-4 rounded-2xl border-4 text-left font-black transition ${userProfile.ageGroup === '56' ? 'border-indigo-400 bg-indigo-50 text-indigo-900 shadow-sm' : 'border-slate-100 bg-slate-50 text-slate-600'}`}>
                <div className="text-lg">🎒 {t.age56}</div>
                <div className="text-xs font-bold text-slate-500 mt-1">{t.desc56}</div>
              </button>
            </div>
          </div>

          <h3 className="text-xl font-black text-slate-800 mb-4">{t.categoriesHeader}</h3>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
            {categoriesData.map((cat) => {
              const targetLesson = activeAgeLessons.find(l => l.categoryId === cat.id);
              return (
                <div
                  key={cat.id}
                  onClick={() => {
                    if (targetLesson) {
                      onSelectLesson(targetLesson.id);
                    } else {
                      onSelectLesson(activeAgeLessons[0]?.id || 'u3-animals');
                    }
                  }}
                  className={`p-5 rounded-3xl border-2 text-left cursor-pointer transition hover:-translate-y-1 hover:shadow-md flex flex-col justify-between h-40 ${cat.bgColor}`}
                >
                  <div className="text-3xl mb-2">{cat.badgeIcon}</div>
                  <div>
                    <h4 className="font-black text-lg leading-snug">{cat.nameEn}</h4>
                    <p className="text-xs font-extrabold opacity-85">{cat.nameVi}</p>
                  </div>
                </div>
              );
            })}
          </div>

          {featured && (
            <div className="bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 rounded-3xl p-6 mb-8 text-white shadow-lg flex flex-col md:flex-row items-center justify-between gap-6">
              <div>
                <span className="bg-white/25 text-xs font-black uppercase tracking-wider px-3 py-1 rounded-full backdrop-blur-sm mb-2 inline-block">🔥 {t.continueLearning}</span>
                <h2 className="text-3xl font-black mb-1">{featured.titleEn}</h2>
                <p className="text-amber-100 font-extrabold text-sm mb-4">{featured.titleVi}</p>
                <button onClick={() => onSelectLesson(featured.id)} className="bg-white text-orange-600 hover:bg-orange-50 font-black px-6 py-3 rounded-2xl shadow-md transition">▶ {t.startLesson}</button>
              </div>
              <div className="text-7xl shrink-0">🎨</div>
            </div>
          )}
        </div>
      );
    };

    const ParentDashboard = ({ onBack }) => {
      const { userProfile, resetProgress, parentPin, updateKidProfile } = useApp();
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState(false);
      const [kidName, setKidName] = useState(userProfile.nickname);
      const [kidAvatar, setKidAvatar] = useState(userProfile.avatar);
      const [kidAge, setKidAge] = useState(userProfile.ageGroup);
      const [saveNotice, setSaveNotice] = useState(false);

      if (!isAuthenticated) {
        return (
          <div className="max-w-md mx-auto px-4 py-12">
            <button onClick={onBack} className="bg-slate-100 font-black px-4 py-2 rounded-2xl mb-6">⬅ Quay lại</button>
            <div className="bg-white p-6 sm:p-8 rounded-3xl border-4 border-indigo-100 shadow-md text-center">
              <h2 className="text-2xl font-black text-slate-800 mb-2">Khóa Phụ Huynh</h2>
              <p className="text-slate-500 font-bold text-xs mb-6">Mã PIN mặc định: <b>1234</b></p>
              <form onSubmit={(e) => { e.preventDefault(); if(enteredPin === parentPin) setIsAuthenticated(true); else setPinError(true); }} className="space-y-4">
                <input type="password" maxLength={4} value={enteredPin} onChange={(e) => setEnteredPin(e.target.value)} placeholder="• • • •" className="w-40 text-center text-3xl font-black tracking-widest px-4 py-3 border-4 rounded-2xl outline-none" autoFocus />
                {pinError && <p className="text-red-500 text-xs">Sai mã PIN!</p>}
                <button type="submit" className="w-full bg-indigo-600 text-white font-black py-3 rounded-2xl">Mở Khóa</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <button onClick={onBack} className="bg-slate-100 font-black px-4 py-2 rounded-2xl mb-6">⬅ Quay lại</button>
          <div className="space-y-6">
            <div className="bg-white p-6 rounded-3xl border-2 shadow-sm">
              <h3 className="text-xl font-black mb-4">⚙️ Cài Đặt Hồ Sơ Bé</h3>
              <form onSubmit={(e) => { e.preventDefault(); updateKidProfile(kidName, kidAvatar, kidAge); setSaveNotice(true); }} className="space-y-4">
                <input type="text" value={kidName} onChange={(e) => setKidName(e.target.value)} className="w-full px-4 py-2.5 border rounded-xl font-bold" />
                <button type="submit" className="bg-emerald-600 text-white font-black px-6 py-2.5 rounded-xl">Lưu Thay Đổi</button>
                {saveNotice && <span className="ml-3 text-emerald-600 font-bold">✓ Đã lưu thành công!</span>}
              </form>
            </div>
            <button onClick={() => { if(confirm('Xóa tiến độ?')) resetProgress(); }} className="bg-red-50 text-red-600 border font-bold px-4 py-2.5 rounded-2xl text-xs">🗑️ Đặt lại tiến độ học</button>
          </div>
        </div>
      );
    };

    const MyLearning = ({ onBack }) => {
      const { userProfile } = useApp();
      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <button onClick={onBack} className="bg-slate-100 font-black px-4 py-2 rounded-2xl mb-6">⬅ Quay lại</button>
          <div className="bg-white p-6 rounded-3xl border-2 shadow-sm">
            <h2 className="text-2xl font-black mb-4">📖 Huy hiệu của {userProfile.nickname}</h2>
            <div className="flex flex-wrap gap-3">{userProfile.badges.map((b, i) => <div key={i} className="w-14 h-14 bg-amber-100 border-2 rounded-2xl flex items-center justify-center text-2xl">{b}</div>)}</div>
          </div>
        </div>
      );
    };

    const MainApp = () => {
      const [view, setView] = useState({ page: 'home' });

      return (
        <div className="min-h-screen flex flex-col">
          <Header onNavigateHome={() => setView({ page: 'home' })} onNavigateParent={() => setView({ page: 'parent' })} onNavigateMyLearning={() => setView({ page: 'my-learning' })} />
          <main className="flex-1">
            {view.page === 'home' && <HomePage onSelectLesson={(lessonId) => setView({ page: 'lesson', lessonId })} />}
            {view.page === 'lesson' && <LessonPage lesson={lessonsData.find(l => l.id === view.lessonId) || lessonsData[0]} onBack={() => setView({ page: 'home' })} />}
            {view.page === 'parent' && <ParentDashboard onBack={() => setView({ page: 'home' })} />}
            {view.page === 'my-learning' && <MyLearning onBack={() => setView({ page: 'home' })} />}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><MainApp /></AppProvider>);
  </script>
</body>
</html>
